<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-label="Request flow: opencode to relay to DeepSeek chat and back">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0e14"/>
      <stop offset="1" stop-color="#0d131b"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M1 1 L11 6 L1 11 z" fill="#4b9fff"/>
    </marker>
    <marker id="arrowg" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M1 1 L11 6 L1 11 z" fill="#59d3a8"/>
    </marker>
  </defs>

  <rect width="1200" height="520" fill="url(#bg2)"/>

  <text x="60" y="52" font-family="ui-monospace, monospace" font-size="15" fill="#41586e">REQUEST PATH</text>
  <path d="M60 66h1080" stroke="#1a2634"/>

  <!-- opencode -->
  <rect x="60" y="120" width="240" height="120" rx="10" fill="#0f1722" stroke="#25405c"/>
  <text x="180" y="160" text-anchor="middle" font-family="ui-monospace, monospace" font-size="18" fill="#e8eef6">opencode</text>
  <text x="180" y="186" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#7f93a8">POST /v1/chat/completions</text>
  <text x="180" y="206" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#7f93a8">stream: true</text>

  <!-- relay -->
  <rect x="380" y="100" width="400" height="160" rx="10" fill="#0f1722" stroke="#2f5c86"/>
  <text x="580" y="132" text-anchor="middle" font-family="ui-monospace, monospace" font-size="18" fill="#e8eef6">relay2.py</text>
  <text x="400" y="160" font-family="ui-monospace, monospace" font-size="12" fill="#59d3a8">127.0.0.1:20232</text>

  <rect x="400" y="176" width="360" height="1" fill="#1e2a3a"/>
  <text x="400" y="200" font-family="ui-monospace, monospace" font-size="12" fill="#7f93a8">prompt contract: system + tools → text tags</text>
  <text x="400" y="222" font-family="ui-monospace, monospace" font-size="12" fill="#7f93a8">session chain · PoW solve · TLS fingerprint</text>
  <text x="400" y="244" font-family="ui-monospace, monospace" font-size="12" fill="#7f93a8">tool_calls ← parsed tagged/DSML reply</text>

  <!-- deepseek -->
  <rect x="860" y="120" width="280" height="120" rx="10" fill="#0f1722" stroke="#25405c"/>
  <text x="1000" y="160" text-anchor="middle" font-family="ui-monospace, monospace" font-size="18" fill="#e8eef6">chat.deepseek.com</text>
  <text x="1000" y="186" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#7f93a8">consumer web account</text>
  <text x="1000" y="206" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#7f93a8">free tier</text>

  <path d="M300 180h72" stroke="#4b9fff" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M780 180h72" stroke="#4b9fff" stroke-width="1.6" marker-end="url(#arrow)"/>

  <text x="336" y="168" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#4b9fff">http</text>
  <text x="816" y="168" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#4b9fff">https</text>

  <!-- return path -->
  <text x="60" y="330" font-family="ui-monospace, monospace" font-size="15" fill="#41586e">RESPONSE PATH</text>
  <path d="M60 344h1080" stroke="#1a2634"/>

  <path d="M860 420h-72" stroke="#59d3a8" stroke-width="1.6" marker-end="url(#arrowg)"/>
  <path d="M380 420h-72" stroke="#59d3a8" stroke-width="1.6" marker-end="url(#arrowg)"/>

  <rect x="60" y="380" width="240" height="80" rx="10" fill="#0f1722" stroke="#25405c"/>
  <text x="180" y="412" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#7f93a8">assistant text</text>
  <text x="180" y="434" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#7f93a8">+ tool_calls</text>

  <rect x="380" y="380" width="400" height="80" rx="10" fill="#0f1722" stroke="#2f5c86"/>
  <text x="580" y="412" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#59d3a8">SSE deltas, word by word</text>
  <text x="580" y="434" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#7f93a8">finish_reason · estimated usage</text>

  <rect x="860" y="380" width="280" height="80" rx="10" fill="#0f1722" stroke="#25405c"/>
  <text x="1000" y="412" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#7f93a8">JSON-patch SSE</text>
  <text x="1000" y="434" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#7f93a8">fragments + status</text>

  <text x="600" y="494" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#41586e">nothing listens on anything but loopback</text>
</svg>
